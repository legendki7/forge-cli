name: Bug report
description: Report reproducible ForgeKi behavior
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Please search existing issues. Never include tokens, credentials, environment values, private project content, or unsanitized logs.
  - type: input
    id: version
    attributes:
      label: ForgeKi version
      placeholder: Desktop About version, forge --version, or local commit
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Product surface
      options:
        - ForgeKi Desktop
        - ForgeKi CLI
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 x64, macOS 15 arm64, Ubuntu 24.04 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest safe sequence that consistently demonstrates the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Preview diagnostics first. Remove usernames, absolute paths, project names, environment values, credentials, and secrets.
